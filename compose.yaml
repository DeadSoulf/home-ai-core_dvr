services:
  dvr:
    build: .
    image: home-ai-core-nvr:1.1.1
    container_name: h.a.c._nvr
    restart: unless-stopped
    environment:
      NVR_SEGMENT_SECONDS: "300"
      NVR_RETENTION_DAYS: "7"
      NVR_MAX_STORAGE_GB: "50"
      NVR_MAX_CAMERAS: "32"
      NVR_DATA_ROOT: "/data"
    ports:
      - "8090:8090"
    volumes:
      - ./data/output:/data
