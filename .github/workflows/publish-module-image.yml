name: Publish NVR module image

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-module-image.yml"
      - "Dockerfile"
      - "bin/**"
      - "sdk/**"
      - "nvr/**"
      - "web/**"
      - "scripts/**"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test NVR camera lifecycle and archive preservation
        run: PYTHONPATH=. python3 -m unittest discover -s nvr -p 'test_*.py' -v

      - name: SDK runtime and archive validation regressions
        run: PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build test image
        run: docker build --platform linux/amd64 -t hac-nvr-test:1.1.5 .

      - name: Test Home AI Core runtime profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .core-test-data
          sudo chown 1001:1001 .core-test-data
          docker run -d --name hac-nvr-test \
            --user 1001:1001 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=bind,src=$PWD/.core-test-data,dst=/data" \
            hac-nvr-test:1.1.5
          trap 'docker logs hac-nvr-test || true; docker rm -f hac-nvr-test || true' EXIT
          for i in $(seq 1 30); do
            if docker exec hac-nvr-test python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/nvr/status', timeout=2).read()" >/dev/null 2>&1; then
              docker exec hac-nvr-test python3 -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8090/api/nvr/status', timeout=2).read().decode())"
              exit 0
            fi
            sleep 1
          done
          echo "NVR API did not become healthy"
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/deadsoulf/home-ai-core_dvr"
          docker tag hac-nvr-test:1.1.5 "$IMAGE:1.1.5"
          docker tag hac-nvr-test:1.1.5 "$IMAGE:sha-${GITHUB_SHA::12}"
          docker push "$IMAGE:1.1.5"
          docker push "$IMAGE:sha-${GITHUB_SHA::12}"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:1.1.5" 2>/dev/null || true)"
          if [ -z "$DIGEST" ]; then
            docker pull "$IMAGE:1.1.5"
            DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:1.1.5")"
          fi
          echo "$DIGEST" | tee image-digest.txt
          echo "### NVR module image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: hac-nvr-image-digest
          path: image-digest.txt
          retention-days: 90
