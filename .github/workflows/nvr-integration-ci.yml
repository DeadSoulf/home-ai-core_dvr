name: NVR camera lifecycle integration
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  nvr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python files
        run: |
          python3 -m py_compile nvr/recorder.py nvr/storage.py web/server.py
      - name: Camera deletion/archive regressions
        run: PYTHONPATH=. python3 -m unittest discover -s nvr -p 'test_*.py' -v
      - name: SDK compatibility and safe vendor staging tests
        run: PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Filesystem capacity regressions
        run: PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build NVR image
        run: docker build --platform linux/amd64 -t hac-nvr-test:1.1.5 .
      - name: Verify NVR status endpoint
        run: |
          set -euo pipefail
          mkdir .test-data
          sudo chown 1001:1001 .test-data
          docker run -d --name hac-nvr-test --user 1001:1001 --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=bind,src=$PWD/.test-data,dst=/data" hac-nvr-test:1.1.5
          trap 'docker logs hac-nvr-test || true; docker rm -f hac-nvr-test || true' EXIT
          for n in $(seq 1 30); do
            if docker exec hac-nvr-test python3 -c               "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/nvr/status', timeout=2).read()" >/dev/null 2>&1; then
              docker exec hac-nvr-test python3 -c "import urllib.request,json; p=json.load(urllib.request.urlopen('http://127.0.0.1:8090/api/nvr/storage',timeout=2)); assert p['ok'] and p['total_bytes'] > 0 and p['available_bytes'] <= p['free_bytes']"
              exit 0
            fi
            sleep 1
          done
          exit 1
