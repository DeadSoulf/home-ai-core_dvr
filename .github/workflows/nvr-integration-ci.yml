name: NVR camera lifecycle integration
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  nvr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python files
        run: |
          python3 -m py_compile nvr/recorder.py nvr/storage.py nvr/sdk_runtime.py nvr/validation.py web/server.py tools/stage_hcnetsdk.py
      - name: Camera deletion/archive regressions
        run: PYTHONPATH=. python3 -m unittest discover -s nvr -p 'test_*.py' -v
      - name: SDK compatibility and safe vendor staging tests
        run: PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Filesystem capacity regressions
        run: PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate opt-in SDK 6.1.11.40 build script syntax
        run: |
          sh -n tools/build_sdk611_local.sh
          sh -n tools/verify_hcnetsdk_abi.sh
          sh -n tools/sdk611_unsupported.sh
          # Runtime image intentionally remains on the legacy SDK until
          # the owner's private vendor archive is staged and tested.
      - name: Build NVR image
        run: docker build --platform linux/amd64 -t hac-nvr-test:1.1.5 .
      - name: Verify real H264 MPEG-PS pipe recording and live HLS
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh hac-nvr-test:1.1.5 -ec '
            mkdir -p /tmp/mp4 /tmp/hls
            ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=320x180:rate=25 \
              -t 4 -c:v libx264 -preset ultrafast -g 25 -f mpeg /tmp/camera.ps
            cat /tmp/camera.ps | ffmpeg -hide_banner -loglevel error -fflags +genpts \
              -i pipe:0 -map 0:v:0 -map 0:a:0? -c copy \
              -f segment -segment_time 2 -reset_timestamps 1 -strftime 1 \
              -segment_format mp4 /tmp/mp4/%Y%m%d_%H%M%S.mp4
            recording=$(find /tmp/mp4 -name "*.mp4" -size +10000c -print -quit)
            test -n "$recording"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name \
              -of csv=p=0 "$recording" | grep -qx h264
            cat /tmp/camera.ps | ffmpeg -hide_banner -loglevel error -fflags +genpts \
              -flags low_delay -probesize 2000000 -analyzeduration 2000000 \
              -i pipe:0 -map 0:v:0 -an -c:v libx264 -preset ultrafast \
              -tune zerolatency -profile:v main -pix_fmt yuv420p \
              -g 25 -keyint_min 25 -sc_threshold 0 -f hls \
              -hls_time 1 -hls_list_size 4 \
              -hls_flags delete_segments+append_list+omit_endlist+independent_segments \
              /tmp/hls/index.m3u8
            test -s /tmp/hls/index.m3u8
            test "$(find /tmp/hls -name "*.ts" -size +10000c | wc -l)" -ge 2
          '
      - name: Verify NVR status endpoint
        run: |
          set -euo pipefail
          mkdir .test-data
          sudo chown 1001:1001 .test-data
          docker run -d --name hac-nvr-test --user 1001:1001 --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=bind,src=$PWD/.test-data,dst=/data" hac-nvr-test:1.1.5
          trap 'docker logs hac-nvr-test || true; docker rm -f hac-nvr-test || true' EXIT
          for n in $(seq 1 30); do
            if docker exec hac-nvr-test python3 -c               "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/nvr/status', timeout=2).read()" >/dev/null 2>&1; then
              docker exec hac-nvr-test python3 -c "import urllib.request,json; p=json.load(urllib.request.urlopen('http://127.0.0.1:8090/api/nvr/storage',timeout=2)); assert p['ok'] and p['total_bytes'] > 0 and p['available_bytes'] <= p['free_bytes']"
              exit 0
            fi
            sleep 1
          done
          exit 1
